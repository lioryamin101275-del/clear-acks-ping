name: acks-ping
# Triggers /api/cron/acks of the WhatsApp agent every 5 minutes.
#
# 11.10.2026: GitHub fired the '*/5' schedule only ~4 times a day (26 runs
# from 05.10 to 11.10 instead of ~1,700), so auto-replies went out hours late.
# Fix: each run stays alive and pings every 5 minutes for ~5h45m, then
# dispatches the next run itself (workflow_dispatch from GITHUB_TOKEN is
# allowed to start a new run). The schedule stays only as a safety net that
# restarts the chain if it ever breaks. Overlap is harmless: a newer run
# cancels the older one, and double sends are blocked by `claim` on the server.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: acks-ping
  cancel-in-progress: true
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: flush due auto-replies every 5 minutes
        env:
          ACKS_URL: ${{ secrets.ACKS_URL }}
        run: |
          end=$(( $(date +%s) + 345*60 ))
          fails=0
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -sS --max-time 60 -o /tmp/out.json -w '%{http_code}' "$ACKS_URL" || echo 000)
            echo "$(date -u +%H:%M) HTTP $code $(head -c 200 /tmp/out.json 2>/dev/null | sed -E 's/"phone":"[0-9]+"/"phone":"***"/g')"
            if [ "$code" = "200" ]; then fails=0; else fails=$((fails+1)); fi
            sleep 300
          done
          echo "consecutive failures at end: $fails"
      - name: start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run acks-ping.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
